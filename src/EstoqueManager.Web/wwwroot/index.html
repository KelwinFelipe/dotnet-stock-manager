<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque Manager | Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <header class="glass-header">
        <div class="container header-content">
            <h1>📦 Estoque Manager</h1>
            <div style="display: flex; gap: 8px;">
                <button id="btn-export-csv" class="btn-secondary" title="Exportar para CSV">📊 CSV</button>
                <button id="btn-export-pdf" class="btn-secondary" title="Exportar para PDF">📄 PDF</button>
                <button id="btn-export-xml" class="btn-secondary" title="Exportar para XML">📑 XML</button>
                <button id="btn-manage-categories" class="btn-secondary">Categorias</button>
                <button id="btn-new-product" class="btn-primary">Novo Produto</button>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- Dashboard / KPIs -->
        <section class="dashboard">
            <div class="card glass-card kpi-card">
                <h3>Total de Produtos</h3>
                <p id="kpi-total-items" class="kpi-value">0</p>
            </div>
            <div class="card glass-card kpi-card">
                <h3>Valor em Estoque</h3>
                <p id="kpi-total-value" class="kpi-value">R$ 0,00</p>
            </div>
            <div class="card glass-card kpi-card warning">
                <h3>Estoque Baixo (< 10)</h3>
                <p id="kpi-low-stock" class="kpi-value">0</p>
            </div>
        </section>

        <!-- Charts Dashboard -->
        <section class="charts-dashboard" style="display: flex; gap: 24px; margin-bottom: 40px; flex-wrap: wrap;">
            <div class="card glass-card chart-container" style="flex: 1; min-width: 300px; padding: 20px; position: relative; height: 350px;">
                <canvas id="category-pie-chart"></canvas>
            </div>
            <div class="card glass-card chart-container" style="flex: 1; min-width: 300px; padding: 20px; position: relative; height: 350px;">
                <canvas id="category-bar-chart"></canvas>
            </div>
        </section>

        <!-- Search & Filter -->
        <section class="controls" style="display: flex; gap: 16px; align-items: center; flex-wrap: wrap;">
            <div class="search-box" style="flex: 1; min-width: 250px;">
                <input type="text" id="search-input" placeholder="Buscar produto por nome...">
                <span class="search-icon">🔍</span>
            </div>
            <div class="filter-box" style="flex: 1; max-width: 300px; min-width: 200px;">
                <select id="category-filter" class="form-control" style="width: 100%; padding: 12px 16px; background: rgba(0, 0, 0, 0.2); border: 1px solid var(--border-color); border-radius: var(--radius-pill); color: var(--text-main);">
                    <option value="">Todas as Categorias</option>
                </select>
            </div>
        </section>

        <!-- Products Table -->
        <section class="table-container glass-card">
            <table id="products-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome do Produto</th>
                        <th>Categoria</th>
                        <th>Preço (R$)</th>
                        <th>Estoque</th>
                        <th>Cadastro</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="products-tbody">
                    <!-- Linhas injetadas via JS -->
                </tbody>
            </table>
            <div id="loading-spinner" class="spinner-container">
                <div class="spinner"></div>
            </div>
            <div id="empty-state" class="empty-state hidden">
                <p>Nenhum produto encontrado.</p>
            </div>
        </section>
    </main>

    <!-- Modals -->
    <!-- Modal de Cadastro/Edição -->
    <div id="product-modal" class="modal-overlay hidden">
        <div class="modal glass-card">
            <div class="modal-header">
                <h2 id="modal-title">Cadastrar Produto</h2>
                <button class="btn-close" id="btn-close-modal">×</button>
            </div>
            <form id="product-form">
                <input type="hidden" id="edit-product-id">
                <div class="form-row">
                    <div class="form-group" style="flex: 2;">
                        <label for="product-name">Nome do Produto</label>
                        <input type="text" id="product-name" required>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label for="product-category">Categoria</label>
                        <select id="product-category" class="form-control" style="width: 100%; padding: 12px 16px; background: rgba(0, 0, 0, 0.2); border: 1px solid var(--border-color); border-radius: var(--radius-md); color: var(--text-main);">
                            <option value="">Sem Categoria</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="product-price">Preço (R$)</label>
                        <input type="number" id="product-price" step="0.01" min="0" required>
                    </div>
                    <div class="form-group">
                        <label for="product-quantity">Quantidade</label>
                        <input type="number" id="product-quantity" min="0" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-secondary" id="btn-cancel-modal">Cancelar</button>
                    <button type="submit" class="btn-primary" id="btn-save-product">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal para Editar Quantidade -->
    <div id="quantity-modal" class="modal-overlay hidden">
        <div class="modal glass-card modal-small">
            <div class="modal-header">
                <h2>Atualizar Estoque</h2>
                <button class="btn-close" id="btn-close-quantity-modal">×</button>
            </div>
            <form id="quantity-form">
                <input type="hidden" id="edit-quantity-id">
                <p id="edit-quantity-name" class="highlight-text"></p>
                <div class="form-group">
                    <label for="new-quantity">Nova Quantidade</label>
                    <input type="number" id="new-quantity" min="0" required>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-secondary" id="btn-cancel-quantity-modal">Cancelar</button>
                    <button type="submit" class="btn-primary">Atualizar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal de Categorias -->
    <div id="category-modal" class="modal-overlay hidden">
        <div class="modal glass-card">
            <div class="modal-header">
                <h2>Gerenciar Categorias</h2>
                <button class="btn-close" id="btn-close-category-modal">×</button>
            </div>
            <input type="hidden" id="edit-category-id">
            <div class="form-row" style="margin-bottom: 20px;">
                <div class="form-group" style="flex: 2; margin-bottom: 0;">
                    <input type="text" id="new-category-name" placeholder="Nome da Categoria..." required>
                </div>
                <div class="form-group" style="flex: 2; margin-bottom: 0;">
                    <input type="text" id="new-category-desc" placeholder="Descrição (opcional)...">
                </div>
                <div class="form-group" style="flex: 1; margin-bottom: 0; display: flex; gap: 8px;">
                    <button id="btn-save-category" class="btn-primary" style="width: 100%;">Salvar</button>
                    <button id="btn-cancel-category-edit" class="btn-secondary hidden" style="width: auto; padding: 10px;" title="Cancelar Edição">×</button>
                </div>
            </div>
            <div class="table-container" style="min-height: auto; max-height: 250px; overflow-y: auto; margin-bottom: 0;">
                <table style="width: 100%;">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Descrição</th>
                            <th style="width: 100px; text-align: center;">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="categories-tbody">
                        <!-- Categorias via JS -->
                    </tbody>
                </table>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-secondary" id="btn-done-category-modal">Concluído</button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <script src="js/app.js"></script>
</body>
</html>
